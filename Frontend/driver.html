<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Transit - Driver Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 text-center">
        <h1 class="text-xl font-bold tracking-wide text-emerald-400">Campus Transit</h1>
        <p class="text-xs text-slate-400">Driver Portal & GPS Streamer</p>
    </header>

    <!-- Main Container -->
    <main class="flex-grow p-4 max-w-md w-full mx-auto flex flex-col justify-center">

        <!-- STEP 1: AUTHENTICATION CARD -->
        <div id="auth-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">Driver Login</h2>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Bus ID</label>
                    <input type="text" id="bus_id" required placeholder="e.g., BUS-101" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Route ID</label>
                    <input type="text" id="route_id" required placeholder="e.g., RT-5" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Phone Number</label>
                    <input type="tel" id="phone_number" required placeholder="10-digit mobile number" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div id="otp-container" class="hidden">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Enter OTP (Hint: 1234)</label>
                    <input type="text" id="otp" maxlength="4" placeholder="1234" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-center tracking-widest text-lg text-emerald-400 focus:outline-none focus:border-emerald-500">
                </div>

                <button type="submit" id="auth-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition shadow-lg">
                    Verify & Continue
                </button>
            </form>
        </div>

        <!-- STEP 2: TRIP CONTROL PANEL (Hidden Initially) -->
        <div id="trip-card" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6 text-center">
            <div>
                <span id="status-badge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30">
                    Ready to Start
                </span>
                <h2 id="display-bus-info" class="text-xl font-bold text-white mt-2">Bus: --</h2>
                <p id="display-route-info" class="text-xs text-slate-400">Route: --</p>
            </div>

            <!-- Telemetry Status Box -->
            <div class="bg-slate-900 rounded-xl p-4 border border-slate-700 text-left space-y-2 text-xs font-mono">
                <div class="flex justify-between">
                    <span class="text-slate-400">Latitude:</span>
                    <span id="lat-val" class="text-emerald-400">--</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">Longitude:</span>
                    <span id="lng-val" class="text-emerald-400">--</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">GPS Status:</span>
                    <span id="gps-status" class="text-slate-500">Idle</span>
                </div>
            </div>

            <!-- Trip Action Buttons -->
            <div class="space-y-3">
                <button id="start-trip-btn" onclick="startTrip()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl text-lg transition shadow-lg flex items-center justify-center space-x-2">
                    <span>🟢 Start Trip</span>
                </button>
                <button id="stop-trip-btn" onclick="stopTrip()" class="hidden w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 rounded-xl text-lg transition shadow-lg">
                    🛑 Stop Trip
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center p-3 text-xs text-slate-500 border-t border-slate-800">
        Campus Transit MVP &bull; Driver Client
    </footer>

    <!-- Script Logic -->
    <script>
        let isOtpStep = false;
        let watchId = null;
        let socket = null;
        let currentBusId = "";

        const loginForm = document.getElementById('login-form');
        const authCard = document.getElementById('auth-card');
        const tripCard = document.getElementById('trip-card');
        const otpContainer = document.getElementById('otp-container');
        const authBtn = document.getElementById('auth-btn');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!isOtpStep) {
                // Step 1: Request OTP flow simulation
                const phone = document.getElementById('phone_number').value;
                if (phone.length < 10) {
                    alert("Please enter a valid 10-digit phone number.");
                    return;
                }
                otpContainer.classList.remove('hidden');
                authBtn.innerText = "Confirm OTP";
                isOtpStep = true;
            } else {
                // Step 2: Verify OTP (Hardcoded 1234)
                const otpVal = document.getElementById('otp').value;
                if (otpVal !== "1234") {
                    alert("Invalid OTP! Use 1234 for testing.");
                    return;
                }

                currentBusId = document.getElementById('bus_id').value;
                const routeId = document.getElementById('route_id').value;

                // Transition views
                authCard.classList.add('hidden');
                tripCard.classList.remove('hidden');

                document.getElementById('display-bus-info').innerText = `Bus: ${currentBusId}`;
                document.getElementById('display-route-info').innerText = `Route: ${routeId}`;
            }
        });

        function startTrip() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser");
                return;
            }

            // Connect WebSocket (Adjust URL to your FastAPI backend address)
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.hostname}:8000/ws/driver/${currentBusId}`;
            
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                document.getElementById('gps-status').innerText = "Connected (Streaming)";
                document.getElementById('gps-status').className = "text-emerald-400 font-bold";
            };

            socket.onerror = (error) => {
                console.error("WebSocket Error:", error);
                document.getElementById('gps-status').innerText = "Connection Error";
                document.getElementById('gps-status').className = "text-rose-400 font-bold";
            };

            socket.onclose = () => {
                document.getElementById('gps-status').innerText = "Disconnected";
                document.getElementById('gps-status').className = "text-slate-500";
            };

            // Toggle UI Buttons
            document.getElementById('start-trip-btn').classList.add('hidden');
            document.getElementById('stop-trip-btn').classList.remove('hidden');
            const badge = document.getElementById('status-badge');
            badge.innerText = "Trip Active";
            badge.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";

            // Start watching position
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const timestamp = Date.now();

                    // Update UI debug preview
                    document.getElementById('lat-val').innerText = lat.toFixed(6);
                    document.getElementById('lng-val').innerText = lng.toFixed(6);

                    // Send payload over WebSocket if open
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        const payload = {
                            bus_id: currentBusId,
                            lat: lat,
                            lng: lng,
                            timestamp: timestamp
                        };
                        socket.send(JSON.stringify(payload));
                    }
                },
                (error) => {
                    alert(`Geolocation error: ${error.message}`);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 5000
                }
            );
        }

        function stopTrip() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (socket) {
                socket.close();
            }

            // Reset UI
            document.getElementById('stop-trip-btn').classList.add('hidden');
            document.getElementById('start-trip-btn').classList.remove('hidden');
            const badge = document.getElementById('status-badge');
            badge.innerText = "Trip Ended";
            badge.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-slate-700 text-slate-400 border border-slate-600";
            document.getElementById('gps-status').innerText = "Idle";
            document.getElementById('gps-status').className = "text-slate-500";
        }
    </script>
</body>
</html>
