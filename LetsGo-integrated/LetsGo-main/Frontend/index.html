<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LetsGo - Live Transit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 font-sans">

  <nav class="bg-blue-600 px-4 py-3 text-white flex items-center justify-between">
    <h1 class="text-xl font-bold">LetsGo</h1>
    <span id="conn" class="text-sm px-2 py-1 rounded bg-yellow-500">Connecting…</span>
  </nav>

  <div class="flex flex-col md:flex-row gap-4 p-4">
    <aside class="md:w-80 space-y-4">
      <section class="bg-white rounded shadow p-3">
        <h2 class="font-semibold mb-2">Routes</h2>
        <ul id="route-list" class="space-y-1 text-sm"></ul>
      </section>
      <section class="bg-white rounded shadow p-3">
        <h2 class="font-semibold mb-2">Vehicles</h2>
        <ul id="vehicle-list" class="space-y-1 text-sm"></ul>
      </section>
    </aside>

    <main class="flex-1">
      <div id="map" class="rounded shadow"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
